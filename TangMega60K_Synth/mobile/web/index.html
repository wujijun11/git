<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tang Synth 控制</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Tang Synth</h1><p>FPGA 乐器 · BLE 控制与曲谱</p>
<div class="card"><div id="capability"></div><button id="connect">连接蓝牙桥</button><button id="disconnect">断开</button><button id="simulate">协议模拟（无硬件）</button><p id="status" role="status">未连接</p></div>
<div class="card"><h2>演奏</h2><label>音色 <select id="timbre"><option value="0">正弦</option><option value="1">风琴</option><option value="2" selected>钢琴</option><option value="3">FM电钢琴</option></select></label><label>效果 <select id="effect"><option value="0">直通</option><option value="1">延迟</option><option value="2">混响</option><option value="3">合唱</option></select></label><label>力度 <input id="velocity" type="range" min="1" max="127" value="100"></label><label>增益 Q1.11 <input id="gain" type="range" min="0" max="4095" value="2048"><output id="gainValue">2048</output></label><label>弯音（音分） <input id="bend" type="range" min="-1200" max="1200" value="0"><output id="bendValue">0</output></label><label>颤音（音分） <input id="vibrato" type="range" min="0" max="100" value="0"><output id="vibratoValue">0</output></label><div id="keys" aria-label="25键琴键"></div><button id="test64">64声部现场测试</button><button id="panic" class="danger">全部停止 / Panic</button></div>
<div class="card"><h2>25 键映射</h2><label>物理键 <select id="mapKey"></select></label><label>MIDI <input id="mapNote" type="number" min="0" max="127" value="60"></label><button id="mapApply">写入映射</button><p>默认 MIDI 60..84；每个物理键均可独立修改。</p></div>
<div class="card"><h2>在线曲谱与脱机引导</h2><label>HTTPS JSON URL <input id="scoreUrl" type="url" placeholder="https://example.org/score.json"></label><button id="loadUrl">在线加载</button><label>或选择本地 JSON <input id="scoreFile" type="file" accept=".json,application/json"></label><p id="scoreInfo">尚未加载曲谱</p><button id="upload">上传并提交曲谱</button><button id="play">播放用户曲谱</button><button id="builtin">选择内置脱机曲谱</button><button id="guideStart">启动 LED 引导</button><button id="guideStop">停止引导</button><button id="stop">停止曲谱</button><details><summary>曲谱格式</summary><pre>{"version":1,"title":"示例","rows":[
{"deltaMs":0,"key":0,"velocity":100,"on":1},
{"deltaMs":500,"key":0,"velocity":0,"on":0}]}</pre></details></div>
<div class="card"><h2>FPGA 演奏事件录音</h2><button id="recordStart">开始录音</button><button id="recordStop">停止录音</button><button id="recordRead">回传录音</button><button id="recordExport">导出 JSON</button><button id="recordReplay">物理琴键事件回放</button><button id="recordClear">清除录音</button><p id="recordInfo">0 条已回传</p><button id="readStatus">读取 FPGA 状态</button><pre id="telemetry">等待状态</pre></div>
<div class="card"><h2>运行日志</h2><pre id="log" aria-live="polite"></pre></div><script src="protocol.js"></script><script src="app.js"></script></body></html>
